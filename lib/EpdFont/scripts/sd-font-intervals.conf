# Unicode intervals for SD card fonts (.cpf)
# Format: hex_start, hex_end (inclusive)
# Lines starting with # are comments

# Greek & Coptic
0x0370, 0x03FF
# Greek Extended
0x1F00, 0x1FFF

# Arabic
0x0600, 0x06FF
# Arabic Supplement
0x0750, 0x077F

# Hebrew
0x0590, 0x05FF

# Thai
0x0E00, 0x0E7F

# Devanagari
0x0900, 0x097F

# Bengali
0x0980, 0x09FF

# Georgian
0x10A0, 0x10FF

# Armenian
0x0530, 0x058F

# CJK Symbols and Punctuation
0x3000, 0x303F
# Hiragana
0x3040, 0x309F
# Katakana
0x30A0, 0x30FF
# Katakana Phonetic Extensions
0x31F0, 0x31FF

# CJK Unified Ideographs
0x4E00, 0x9FFF
# CJK Compatibility Ideographs
0xF900, 0xFAFF

# Hangul Jamo
0x1100, 0x11FF
# Hangul Compatibility Jamo
0x3130, 0x318F
# Hangul Syllables
0xAC00, 0xD7AF

# CJK Radicals Supplement
0x2E80, 0x2EFF
# Kangxi Radicals
0x2F00, 0x2FDF

# Halfwidth Katakana
0xFF60, 0xFF9F
# CJK Compatibility Forms
0xFE30, 0xFE4F
